<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignments - College Connect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="assignments">
  <div id="page-content" hidden>
    <h1>Assignments</h1>
    <p class="sub">Status changes here are a demo. No file is uploaded or sent to a teacher. <span id="asgSource"></span></p>
    <div id="asgMsg" class="notice ok" role="status" hidden></div>
    <div class="card">
      <input id="asgSearch" type="search" placeholder="Search by title or subject" aria-label="Search assignments">
      <div class="tabs" style="margin:14px 0 8px">
        <button class="tab active" data-filter="All">All</button>
        <button class="tab" data-filter="Pending">Pending</button>
        <button class="tab" data-filter="Submitted">Submitted</button>
        <button class="tab" data-filter="Overdue">Overdue</button>
      </div>
      <div><small id="asgCounts" style="color:#5f6b83"></small></div>
    </div>
    <div id="asgLoading" class="empty">Loading assignments...</div>
    <div id="asgList"></div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
